[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillbank"
version = "0.1.0"
description = "Skill-augmented LLM agent with persistent skill bank"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12,<1.0",
    "anthropic>=0.30,<1.0",
    "openai>=1.35,<2.0",
    "chromadb>=0.5,<1.0",
    "sentence-transformers>=3.0,<4.0",
    "instructor>=1.3,<2.0",
    "pydantic>=2.7,<3.0",
    "streamlit>=1.35,<2.0",
    "rich>=13.7,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[project.scripts]
skillbank = "skillbank.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/skillbank"]

[tool.pytest.ini_options]
pythonpath = ["src"]
